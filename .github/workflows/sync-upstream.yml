name: Sync upstream, translate, release

# Every 30 minutes: pull the upstream repository into this fork, translate the
# strings that arrived with it, and — when upstream cut a release — build and
# publish the Chinese build for that tag.
#
# Why a schedule and not an event: GitHub cannot notify a fork about a release
# in another repository. Polling `git fetch upstream` is the one mechanism that
# needs no token in a third place.
#
# Two things about GitHub that shape this file:
#   - A push made with GITHUB_TOKEN does NOT trigger other workflows, so the
#     release is started explicitly with `gh workflow run`. That also means the
#     checks below are the only gate before the commit lands: nothing else will
#     run on it.
#   - The tag that gets built must be OUR commit (upstream + translations), not
#     upstream's. So the tag is created here, on HEAD, after the commit.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Also run the release for the newest upstream tag, even if this fork already released it.'
        type: boolean
        default: false

permissions:
  contents: write # commit, tag, push
  issues: write   # report a conflict instead of failing silently
  actions: write  # gh workflow run release.yml

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/PurpleDoubleD/locally-uncensored.git
  # Non-sensitive, and at workflow level so a step `if:` can see it. The token
  # stays on the one step that needs it.
  TRANSLATE_ENDPOINT: ${{ vars.TRANSLATE_ENDPOINT }}
  TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bot identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          git fetch --tags --prune upstream master

      - name: Anything new?
        id: check
        run: |
          behind=$(git rev-list --count HEAD..upstream/master)
          upstream_tag=$(git describe --tags --abbrev=0 upstream/master 2>/dev/null || echo '')
          echo "behind=${behind}"             >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "upstream 领先 ${behind} 个提交；最新 tag=${upstream_tag:-无}"

      - name: Nothing to do
        if: steps.check.outputs.behind == '0'
        run: echo '没有新提交（tag 检查见最后一步）'

      # ── Everything below only runs when upstream moved ──────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.behind != '0'
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          if git merge --no-edit upstream/master; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo 'merged=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Report the conflict and stop
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "上游合并冲突（$(date -u +%F)）" \
            --body "自动合并 upstream/master 时冲突，已中止，未推送任何内容。\n\n需要人工解决后重跑本工作流。" \
            --label i18n || true
          echo '::error::上游合并冲突，已中止'
          exit 1

      - name: Install dependencies
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'true'
        run: npm ci

      - name: Extract the strings that are not translated yet
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'true'
        run: node scripts/i18n-extract.mjs --out "$RUNNER_TEMP/extract.json"

      # The translation step is skipped when no endpoint is configured, which is
      # how the pipeline runs before a model provider has been chosen: sync and
      # extract still work, and the report says how much is left.
      - name: Translate
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'true' && env.TRANSLATE_ENDPOINT != ''
        env:
          TRANSLATE_TOKEN: ${{ secrets.TRANSLATE_TOKEN }}
        run: |
          node scripts/i18n-translate.mjs \
            --in "$RUNNER_TEMP/extract.json" \
            --out "$RUNNER_TEMP/translations.json"
          node scripts/i18n-apply.mjs --in "$RUNNER_TEMP/translations.json"

      - name: Say what is still English
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'true'
        env:
          TRANSLATE_ENDPOINT: ${{ vars.TRANSLATE_ENDPOINT }}
        run: |
          {
            echo '### 汉化状态'
            echo
            echo "上游新提交：${{ steps.check.outputs.behind }}"
            if [ -n "$TRANSLATE_ENDPOINT" ]; then
              echo '本轮已调用翻译端点。'
            else
              echo '未配置 TRANSLATE_ENDPOINT：本轮只同步 + 抽取，未翻译。'
            fi
            node scripts/i18n-check.mjs || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the dictionary, types, lint and the i18n tests
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'true'
        run: |
          node scripts/i18n-check.mjs
          npx tsc -b --force
          npx eslint src/lib/i18n scripts
          npx vitest run src/lib/__tests__/i18n.test.ts src/lib/__tests__/i18n-pack.test.ts src/lib/__tests__/i18n-bridge.test.ts

      - name: Commit and push
        id: commit
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.merged == 'true'
        run: |
          # Explicit paths only: the working tree also holds build artefacts and
          # local notes (see AGENTS.md §3.3).
          git add src/lib/i18n/zh-CN.ts src/lib/i18n/skip.json 2>/dev/null || git add src/lib/i18n/zh-CN.ts
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '没有需要提交的内容'
          else
            git commit -m "自动同步上游 $(git rev-parse --short upstream/master) 并更新中文词典"
            git push origin HEAD:master
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # ── Release, when upstream cut a tag this fork has not published ─────
      - name: Which upstream tag is new?
        id: tag
        if: always() && steps.check.outputs.upstream_tag != ''
        env:
          TAG: ${{ steps.check.outputs.upstream_tag }}
          FORCE: ${{ inputs.force_release }}
        run: |
          base="${TAG#v}"
          existing=$(git tag --list "v${base}-zh.*" | sort -V | tail -1)
          if [ -n "$existing" ] && [ "$FORCE" != 'true' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "已发布过 ${existing}，跳过"
            exit 0
          fi
          n=1
          while git tag --list "v${base}-zh.${n}" | grep -q .; do n=$((n + 1)); done
          echo "new_tag=v${base}-zh.${n}" >> "$GITHUB_OUTPUT"
          echo "skip=false"                >> "$GITHUB_OUTPUT"
          echo "将发布 v${base}-zh.${n}"

      - name: Tag this commit and start the release
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          # The tag points at OUR commit — upstream's tag would build the
          # English tree, because release.yml checks out the tag it is given.
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            -f tag="$NEW_TAG" -f zh_release=true
          echo "已触发 $NEW_TAG 的构建"
