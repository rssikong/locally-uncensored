name: 上游巡检

# Hourly: is there anything new upstream, and can it be merged?
#
#   no new commits, no new tag  -> 30 seconds, nothing else
#   new commits                 -> merge, translate, push master (no release)
#   new upstream tag             -> the above, then tag `v<ver>-zh.<n>` and hand
#                                  the build to release-zh.yml
#
# The release itself is expensive (gate + two installers, ~50 minutes), so it
# runs only when upstream cut a version. Everything before that is a few
# minutes and can afford to run every hour.
#
# A merge conflict is not a person's job: upstream's side is taken and the fork's
# small patches (.fork/patches) are replayed on top. If a patch no longer
# applies, nothing is pushed and no release happens — the fork keeps the last
# good version and an issue says what broke.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Release the newest upstream tag even if this fork already released it (bumps zh.<n>).'
        type: boolean
        default: false
      dry_run:
        description: 'Merge and check, but push nothing, tag nothing, release nothing.'
        type: boolean
        default: false
      retranslate:
        description: 'Translate whatever is still pending and commit the dictionary, without merging upstream. Recovers translations a lost run threw away.'
        type: boolean
        default: false

permissions:
  contents: write # commit, tag, push
  issues: write   # report a failure instead of failing silently
  actions: write  # dispatch release-zh.yml

concurrency:
  group: watch-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/PurpleDoubleD/locally-uncensored.git
  # Non-sensitive; at workflow level so a step `if:` sees it. The token stays on
  # the one step that needs it.
  TRANSLATE_ENDPOINT: ${{ vars.TRANSLATE_ENDPOINT }}
  TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}

jobs:
  watch:
    name: 巡检
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: 设置机器人身份
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: 拉取上游
        run: |
          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          git fetch --tags --prune upstream master

      - name: 有什么新东西
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          behind=$(git rev-list --count HEAD..upstream/master)
          tag=$(git describe --tags --abbrev=0 upstream/master 2>/dev/null || echo '')
          zh_tag=''
          released=''
          if [ -n "$tag" ]; then
            base="${tag#v}"
            zh_tag=$(git tag --list "v${base}-zh.*" | sort -V | tail -1)
            # A tag alone is not a release. `gh run rerun` cannot re-run a run
            # that is still in progress, so the retry lives here: a zh tag with
            # no GitHub release means the build finished red, and the next
            # hourly run dispatches it again.
            if [ -n "$zh_tag" ] && gh release view "$zh_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              released="$zh_tag"
            fi
          fi
          {
            echo "behind=$behind"
            echo "upstream_tag=$tag"
            echo "zh_tag=$zh_tag"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"
          echo "上游领先 ${behind} 个提交；最新 tag=${tag:-无}；中文 tag=${zh_tag:-无}；已发布=${released:-无}"

      - name: 无事可做
        if: steps.check.outputs.behind == '0' && (steps.check.outputs.upstream_tag == '' || (steps.check.outputs.released != '' && inputs.force != true))
        run: echo '上游没有新提交，也没有未发布的新 tag —— 结束'

      # ── Everything below needs something new ─────────────────────────────
      - name: 合并上游（冲突取上游，再重放补丁）
        id: merge
        if: steps.check.outputs.behind != '0'
        shell: bash
        run: |
          set -uo pipefail
          if git merge --no-edit upstream/master; then
            echo "merged=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "合并冲突，采用上游版本并重放补丁："
          conflicted=$(git diff --name-only --diff-filter=U)
          echo "$conflicted" | sed 's/^/  /'
          # Take upstream's side for every conflicted file …
          while IFS= read -r f; do
            [ -n "$f" ] && git checkout --theirs -- "$f" && git add -- "$f"
          done <<< "$conflicted"

          # … then put the fork's own changes back on top.
          failed=0
          for patch in .fork/patches/*.patch; do
            if git apply --3way "$patch" 2>/dev/null; then
              echo "  重放 $(basename "$patch")"
            elif git apply --reverse --check "$patch" 2>/dev/null; then
              echo "  已在 $(basename "$patch") 中（未冲突）"
            else
              echo "::error::补丁无法重放：$(basename "$patch")"
              failed=1
            fi
          done

          if [ "$failed" != "0" ]; then
            git merge --abort
            echo "replayed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          echo "replayed=true" >> "$GITHUB_OUTPUT"

      - name: 补丁无法重放：报告并停止
        if: steps.merge.outputs.replayed == 'false'
        # Reporting must never be the thing that hides the failure: if the issue
        # cannot be opened (issues switched off, token without scope), the run is
        # already red and the log above says which patch failed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-report.sh "上游合并冲突：补丁无法重放" "$(printf '%s\n' \
            "自动合并时冲突，取上游后补丁重放失败，**没有推送、没有发版**，站点继续用上一个版本。" \
            "" \
            "- 运行：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "- 上游 tag：\`${{ steps.check.outputs.upstream_tag }}\`，领先 ${{ steps.check.outputs.behind }} 个提交" \
            "" \
            "处理：看上面日志里失败的那个补丁，修好对应文件后跑 \`node scripts/fork-patches.mjs --regenerate\`，再手动触发本工作流。")"
          exit 1

      - name: 安装依赖
        if: (steps.check.outputs.behind != '0' || inputs.retranslate) && steps.merge.outputs.replayed != 'false'
        shell: bash
        run: |
          ok=0
          for attempt in 1 2 3; do
            if npm ci; then ok=1; break; fi
            echo "npm ci failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          [ "$ok" = "1" ] || { echo '::error::npm ci failed after 3 attempts'; exit 1; }

      - name: 抽取还没翻译的文案
        if: (steps.check.outputs.behind != '0' || inputs.retranslate) && steps.merge.outputs.replayed != 'false'
        run: node scripts/i18n-extract.mjs --out "$RUNNER_TEMP/extract.json"

      - name: 翻译
        if: (steps.check.outputs.behind != '0' || inputs.retranslate) && steps.merge.outputs.replayed != 'false' && env.TRANSLATE_ENDPOINT != ''
        env:
          TRANSLATE_TOKEN: ${{ secrets.TRANSLATE_TOKEN }}
        run: |
          node scripts/i18n-translate.mjs \
            --in "$RUNNER_TEMP/extract.json" \
            --out "$RUNNER_TEMP/translations.json"
          node scripts/i18n-apply.mjs --in "$RUNNER_TEMP/translations.json"

      # Cheap on purpose: the full CI (e2e, cargo) belongs to the release gate.
      # This only answers "did the merge break the dictionary, the types, or the
      # i18n layer" before the commit lands.
      - name: 校验词典、类型与 i18n 单测
        if: (steps.check.outputs.behind != '0' || inputs.retranslate) && steps.merge.outputs.replayed != 'false'
        shell: bash
        run: |
          node scripts/i18n-check.mjs
          npx tsc -b --force
          npx vitest run src/lib/__tests__/i18n.test.ts src/lib/__tests__/i18n-pack.test.ts src/lib/__tests__/i18n-bridge.test.ts

      - name: 汇总说明
        if: always()
        shell: bash
        run: |
          {
            echo '### 上游巡检'
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游新提交 | ${{ steps.check.outputs.behind }} |"
            echo "| 上游最新 tag | \`${{ steps.check.outputs.upstream_tag }}\` |"
            echo "| 已发布的中文 tag | \`${{ steps.check.outputs.released }}\` |"
            echo "| 合并 | ${{ steps.merge.outputs.merged }}${{ steps.merge.outputs.replayed }} |"
            echo "| 模式 | ${{ inputs.dry_run && 'dry run（不推送）' || '正常' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交并推送
        id: commit
        if: (steps.check.outputs.behind != '0' || inputs.retranslate) && steps.merge.outputs.replayed != 'false' && inputs.dry_run != true
        shell: bash
        run: |
          # Explicit paths only: the working tree also holds build artefacts and
          # local notes. The replayed patches bring their own files, which the
          # merge already staged.
          #
          # `git add a b` fails as a whole when one of the paths is missing, and
          # that is how run 39659346340 lost 825 fresh translations: skip.json
          # has never existed in this repo, so the add staged nothing and the
          # step reported "the dictionary did not change". Stage what is there.
          for f in src/lib/i18n/zh-CN.ts src/lib/i18n/skip.json; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done

          # If the dictionary was rewritten but nothing reached the index, fail
          # loudly instead of throwing the translations away a second time.
          if ! git diff --quiet -- src/lib/i18n/zh-CN.ts && git diff --cached --quiet; then
            echo '::error::词典已被改写，但没有进入暂存区——不要静默丢弃译文'
            exit 1
          fi

          # A clean merge has already made its commit, and a docs-only upstream
          # change leaves the dictionary byte-identical — so "nothing staged"
          # says nothing about whether there is something to push.
          if ! git diff --cached --quiet; then
            if [ "${{ steps.check.outputs.behind }}" = '0' ]; then
              git commit -m "汉化：补齐待译词条"
            else
              git commit -m "自动同步上游 $(git rev-parse --short upstream/master) 并更新中文词典"
            fi
          else
            echo '词典没有新变化，只推送合并提交'
          fi

          if git rev-parse --verify --quiet origin/master >/dev/null; then
            ahead=$(git rev-list --count HEAD --not origin/master)
          else
            ahead='?'
          fi
          echo "待推送提交：${ahead}"
          if [ "$ahead" = '0' ]; then
            echo '本地没有新提交，跳过推送'
            exit 0
          fi

          git push origin HEAD:master || {
            echo '推送被拒，rebase 后重试一次'
            git pull --rebase origin master
            git push origin HEAD:master
          }

      - name: dry run 后撤销合并
        if: inputs.dry_run == true
        run: git reset --hard origin/master

      # ── Release, when upstream cut a tag this fork has not published ─────
      - name: 上游有没有新 tag
        id: tag
        # `success()` and not `always()`: a red gate or a rejected push must not
        # be followed by a tag and a release. When nothing changed upstream this
        # step still runs, because every step above was legitimately skipped.
        if: ${{ success() && steps.check.outputs.upstream_tag != '' && steps.merge.outputs.replayed != 'false' }}
        shell: bash
        env:
          TAG: ${{ steps.check.outputs.upstream_tag }}
          ZH_TAG: ${{ steps.check.outputs.zh_tag }}
          RELEASED: ${{ steps.check.outputs.released }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          base="${TAG#v}"
          moved=false
          if [ -n "$RELEASED" ] && [ "$FORCE" != 'true' ]; then
            # A published version does not stay published: upstream re-tags.
            # 3.0.8 was released on b86747ba at 17:53, then four "3.0.8 fixes"
            # were pushed and the tag was MOVED to 0aac9711 at 01:48 — same
            # name, different code. Comparing tag names alone said "already
            # released" and the fixes never reached an installer.
            #
            # So compare the commits: if the commit the upstream tag points at
            # is already inside the commit we shipped, there is nothing to do.
            # Otherwise it is new payload under an old name and gets its own
            # zh tag (v3.0.8-zh.2), exactly like a new version.
            upstream_commit="$(git rev-list -n1 "$TAG" 2>/dev/null || echo '')"
            shipped_commit="$(git rev-list -n1 "$RELEASED" 2>/dev/null || echo '')"
            if [ -z "$upstream_commit" ] || [ -z "$shipped_commit" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "已发布过 ${RELEASED}（取不到提交，保守跳过）"
              exit 0
            fi
            if git merge-base --is-ancestor "$upstream_commit" "$shipped_commit"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "已发布过 ${RELEASED}，且它已包含 ${TAG} 当前的提交 ${upstream_commit:0:8}，跳过"
              exit 0
            fi
            echo "上游把 ${TAG} 从已发布的版本移到了新提交（${shipped_commit:0:8} → ${upstream_commit:0:8}），当作新版本发"
            moved=true
          fi
          # A tag that exists without a release is a build that ended red: keep
          # that tag and try again, instead of inventing zh.2 for the same commit.
          # Not when the tag only looks published because upstream moved it — that
          # is a new payload and needs the next number, not a rebuild of zh.1.
          if [ "$moved" = 'false' ] && [ -n "$ZH_TAG" ] && [ "$FORCE" != 'true' ]; then
            echo "new_tag=${ZH_TAG}" >> "$GITHUB_OUTPUT"
            echo "skip=false"        >> "$GITHUB_OUTPUT"
            echo "上次发布未完成，重试 ${ZH_TAG}"
            exit 0
          fi
          n=1
          while git tag --list "v${base}-zh.${n}" | grep -q .; do n=$((n + 1)); done
          echo "new_tag=v${base}-zh.${n}" >> "$GITHUB_OUTPUT"
          echo "skip=false"                >> "$GITHUB_OUTPUT"
          echo "将发布 v${base}-zh.${n}"

      - name: 打 tag 并启动发布
        if: steps.tag.outputs.skip == 'false' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          # The tag points at OUR commit — upstream's tag would build the
          # English tree, because release-zh.yml checks out the tag it is given.
          # On a retry the tag is already there; pushing it again would fail.
          if git tag --list "$NEW_TAG" | grep -q .; then
            echo "tag 已存在（上次发布未完成），直接重试"
          else
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
          fi
          gh workflow run release-zh.yml --repo "$GITHUB_REPOSITORY" -f tag="$NEW_TAG"
          echo "已触发 $NEW_TAG 的构建与发布"

      # Upstream adds workflows now and then — 3.0.8 brought `codeql.yml` and
      # `scorecard.yml`, and a newly added workflow file is ACTIVE by default, so
      # it starts burning minutes on the next push. That is what GitHub's
      # "workflows on this fork have been disabled" policy exists to punish, and
      # the last time it fired it stopped every workflow in the repository for
      # three days. Keep exactly the two this fork owns; everything else off.
      #
      # Matching is on the file path, not the display name: the names are
      # Chinese now and a rename would otherwise take our own workflows down.
      - name: 只留本 fork 需要的工作流
        if: always() && inputs.dry_run != true
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep='.github/workflows/watch-upstream.yml .github/workflows/release-zh.yml'
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.state=="active") | "\(.id) \(.path)"' |
          while read -r id path; do
            case " $keep " in *" $path "*) continue ;; esac
            echo "禁用（本 fork 不需要）：$path"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable" >/dev/null \
              || echo "  禁用失败，下次巡检再试"
          done

      - name: 失败时开 issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-report.sh "上游同步失败" "$(printf '%s\n' \
            "巡检运行失败，**没有发版**（站点继续用上一个版本）。" \
            "" \
            "- 运行：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "- 上游 tag：\`${{ steps.check.outputs.upstream_tag }}\`，领先 ${{ steps.check.outputs.behind }} 个提交" \
            "" \
            "看运行日志里第一个红色步骤；常见原因：npm 网络抖动（已内置 3 次重试）、上游改到了我们补丁所在的行。")"
