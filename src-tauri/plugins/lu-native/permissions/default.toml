"$schema" = "schemas/schema.json"

[default]
description = "Everything the phone shell needs from the native layer. `simulate-memory-warning` is listed although the command only acts in a build with the cargo feature `abnahme`; without the feature it answers with an error."
permissions = [
  "allow-share-file",
  "allow-save-to-photos",
  "allow-save-to-files",
  "allow-write-temp-file",
  "allow-download-to-temp",
  "allow-delete-temp-file",
  "allow-device-info",
  "allow-simulate-memory-warning",
  "allow-begin-background-task",
  "allow-end-background-task",
  "allow-back-arm",
  "allow-back-ack",
  "allow-back-exit",
  "allow-pending-deep-link",
  "allow-haptic",
  "allow-open-external",
  "allow-scan-qr",
  "allow-open-system-settings",
  "allow-set-system-bars",
  "allow-remote-client-request",
  "allow-remote-client-cancel",
  "allow-bg-download-start",
  "allow-bg-download-pause",
  "allow-bg-download-resume",
  "allow-bg-download-cancel",
  "allow-bg-download-forget",
  "allow-bg-download-list",
  "allow-bg-download-network-rule",
  "allow-bg-download-allow-metered",
  "allow-connection-info",
  "allow-request-notification-permission",
  "allow-tts-voices",
  "allow-tts-speak",
  "allow-tts-stop",
  "allow-import-model-document",
  "allow-import-model-cancel",
  "allow-bg-download-limit",
  "allow-transcode-image",
  "allow-clipboard-read-text",
  "allow-clipboard-write-text",
  "allow-local-notify",
  "allow-remote-watch",
  "allow-remote-notify-permission",
  "allow-apple-sign-in",
  "allow-web-auth",
  "allow-pick-documents",
  "allow-read-temp-file",
  "allow-iap-products",
  "allow-iap-purchase",
  "allow-iap-finish",
  "allow-iap-unfinished",
]
