[package]
name = "testbett"
version = "0.1.0"
description = "Testbett fuer den iOS-Treiber von LU Mobile"
edition = "2021"

[lib]
name = "testbett_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde_json = "1"
tauri-plugin-luharness = { version = "0.1.0", path = "../plugin" }

[features]
# Macht die WKWebView auch im Release-Bau inspizierbar. Nie in einem Store-Bau.
abnahme = ["tauri/devtools"]
